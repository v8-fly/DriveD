<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>Dad's Docs</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F9;--surface:#FFFFFF;--ink:#1B1F2A;--muted:#5A6472;--line:#E5E8EF;--soft:#F0F2F7;--blue:#2563EB;--amber:#EA580C;--teal:#0D9488;--green:#16A34A;--red:#DC2626;--primary:#4F46E5;--primary-2:#6366F1;--shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow:0 1px 3px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.08);--shadow-lg:0 12px 32px rgba(16,24,40,.14)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 20px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;min-height:76px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:var(--shadow)}
header h1{flex:1;margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.18);color:#fff;flex:none}
.logo svg.i{width:26px;height:26px}
.back{display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
.back:active{background:rgba(255,255,255,.28)}
.back[hidden]{display:none}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
.screen[hidden]{display:none}
svg.i{width:36px;height:36px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;margin:0 0 14px;padding:12px 20px;border:0;border-radius:18px;color:#fff;font:700 25px/1.2 "Atkinson Hyperlegible",system-ui,sans-serif;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
.big:active{transform:scale(.98);box-shadow:var(--shadow-sm)}
.big svg.i{width:42px;height:42px}
.blue{background:linear-gradient(135deg,#2563EB,#3B82F6)}
.amber{background:linear-gradient(135deg,#EA580C,#F97316)}
.teal{background:linear-gradient(135deg,#0D9488,#14B8A6)}
.green{background:linear-gradient(135deg,#16A34A,#22C55E)}
.plain{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow-sm)}
.big:disabled{opacity:.55;box-shadow:none}
:focus-visible{outline:4px solid #FBBF24;outline-offset:3px}
.lead{font-size:22px;margin:4px 0 20px}
.note{color:var(--muted);margin:8px 0}
.link{display:inline-block;margin:6px 0;padding:10px 0;border:0;background:none;color:var(--blue);font:700 20px "Atkinson Hyperlegible",system-ui,sans-serif;text-decoration:underline;cursor:pointer}
.folder{display:flex;align-items:center;gap:16px;width:100%;min-height:84px;margin:0 0 12px;padding:12px 18px;border:0;border-radius:18px;background:var(--surface);color:var(--ink);font:700 24px/1.2 "Atkinson Hyperlegible",system-ui,sans-serif;text-align:left;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.folder:active{transform:scale(.98);box-shadow:var(--shadow)}
.folder svg.i{width:44px;height:44px;color:var(--teal)}
.folder small{display:block;font:400 17px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted)}
.file-list{margin:20px 0 0}
.file-list h2{font-size:24px;margin:0 0 12px}
.file{display:flex;align-items:center;gap:14px;min-height:68px;margin:0 0 10px;padding:12px 16px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm)}
.file svg.i{width:32px;height:32px;color:var(--blue)}
.file span{min-width:0;font-weight:700;overflow-wrap:anywhere}
.file small{display:block;font:400 16px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted)}
form{margin:0 0 20px;padding:18px;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm)}
label{display:block;margin-bottom:8px;font-weight:700}
input[type=text]{width:100%;height:60px;margin-bottom:14px;padding:0 16px;border:2px solid #B9C2D0;border-radius:14px;background:var(--surface);font:400 22px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease}
input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
#pimg{display:block;width:100%;max-height:300px;margin:0 0 16px;object-fit:contain;border-radius:16px;background:var(--soft)}
.prog{height:16px;margin:12px 0 4px;border-radius:8px;background:var(--soft);overflow:hidden}
.prog div{width:0;height:100%;background:linear-gradient(90deg,var(--green),#22C55E);transition:width .2s;border-radius:8px}
.tick{display:grid;place-items:center;width:120px;height:120px;margin:12px auto 16px;border-radius:50%;background:linear-gradient(135deg,var(--green),#22C55E);color:#fff;box-shadow:var(--shadow-lg)}
.tick svg.i{width:72px;height:72px;stroke-width:3}
h2{margin:0 0 8px;font-size:30px;letter-spacing:-.01em}
.center{text-align:center}
.err h2{color:var(--red)}
@media (prefers-reduced-motion:no-preference){.tick{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
</svg>

<header>
  <button id="back" class="back" aria-label="Go back" hidden><svg class="i"><use href="#i-back"/></svg></button>
  <div class="logo" aria-hidden="true"><svg class="i"><use href="#i-folder"/></svg></div>
  <h1 id="title">Dad's Docs</h1>
</header>

<main>
  <section id="signin" class="screen" hidden>
    <p class="lead" id="signin-text">Sign in once with your Google account. Your photos and files will be saved to your Google Drive.</p>
    <button id="signin-btn" class="big blue"><svg class="i"><use href="#i-up"/></svg>Sign in with Google</button>
  </section>

  <section id="home" class="screen" hidden>
    <button id="h-cam" class="big blue"><svg class="i"><use href="#i-camera"/></svg>Take photo</button>
    <button id="h-file" class="big amber"><svg class="i"><use href="#i-file"/></svg>Add file</button>
    <button id="h-folders" class="big teal"><svg class="i"><use href="#i-folder"/></svg>My folders</button>
    <p id="last" class="note"></p>
  </section>

  <section id="folders" class="screen" hidden>
    <button id="newbtn" class="big teal"><svg class="i"><use href="#i-plus"/></svg>New folder</button>
    <form id="nform" hidden>
      <label for="nname">Folder name</label>
      <input id="nname" type="text" maxlength="80" autocomplete="off" placeholder="For example: Bank">
      <p id="nerr" class="note" hidden>Please type a name first.</p>
      <button class="big green" type="submit" style="margin:0">Create folder</button>
    </form>
    <div id="flist"></div>
  </section>

  <section id="inside" class="screen" hidden>
    <button id="i-cam" class="big blue"><svg class="i"><use href="#i-camera"/></svg>Take photo</button>
    <button id="i-file" class="big amber"><svg class="i"><use href="#i-file"/></svg>Add file</button>
    <a id="i-drive" class="link" target="_blank" rel="noopener">See this folder in Google Drive</a>
    <div class="file-list">
      <h2>Files in this folder</h2>
      <div id="filelist" aria-live="polite"></div>
    </div>
  </section>

  <section id="preview" class="screen" hidden>
    <img id="pimg" alt="Preview of your photo" hidden>
    <p class="lead" id="pcount"></p>
    <div id="names"></div>
    <p>Saving to folder: <strong id="pfolder"></strong><br><button id="pchange" class="link">Change folder</button></p>
    <div id="prog" class="prog" hidden><div id="bar"></div></div>
    <p id="status" class="note" aria-live="polite"></p>
    <button id="save" class="big green"><svg class="i"><use href="#i-up"/></svg>Save to Drive</button>
    <button id="pcancel" class="big plain">Cancel</button>
  </section>

  <section id="done" class="screen center" hidden>
    <div class="tick"><svg class="i"><use href="#i-check"/></svg></div>
    <h2>Saved</h2>
    <p class="lead" id="dfolder"></p>
    <button id="d-more" class="big blue"><svg class="i"><use href="#i-plus"/></svg>Add another</button>
    <button id="d-home" class="big plain">Go to home</button>
  </section>

  <section id="msg" class="screen err" hidden>
    <h2 id="mtitle"></h2>
    <p class="lead" id="mtext"></p>
    <button id="retry" class="big blue">Try again</button>
    <button id="mhome" class="big plain">Go to home</button>
  </section>
</main>

<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="pick" type="file" multiple hidden>

<script src="/app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
